name: Fit3BridgeFree
options:
  bundleIdPrefix: com.fit3bridgefree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Fit3Kit:
    path: Fit3Kit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Fit3BridgeFree:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
    dependencies:
      - package: Fit3Kit
    entitlements:
      path: App/Fit3BridgeFree.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fit3BridgeFree
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Fit3BridgeFree 需要使用蓝牙连接你的 Galaxy Fit3 手环，以提供来电提醒和健康数据同步。
        NSHealthShareUsageDescription: 读取 Apple Health 数据以避免重复写入步数与心率。
        NSHealthUpdateUsageDescription: 将 Galaxy Fit3 的步数与心率同步写入 Apple Health。
        UIBackgroundModes: [bluetooth-central, audio]
    settings:
      base:
        # 每个使用者必须使用自己的唯一 Bundle ID（免费 Apple ID 签名要求）。
        # 如 Xcode 提示被占用，请改成自己的，例如 com.你的名字.fit3bridgefree。
        PRODUCT_BUNDLE_IDENTIFIER: com.fit3bridgefree.ios
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
